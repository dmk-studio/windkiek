# Builds the firmware on every push. On main the website (site/) is published to GitHub Pages
# together with the firmware for the web installer. A tag like v1.0.0 also creates a release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run
      - name: Prepare website
        run: |
          version=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' include/config.h)
          cp -r site _site
          cp .pio/build/reterminal_e1001/windkiek.bin _site/firmware/
          sed -i "s/\"version\": \".*\"/\"version\": \"$version\"/" _site/firmware/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/reterminal_e1001/windkiek.bin
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Release notes: the CHANGELOG section of this version (tag v1.0.0 -> "## 1.0.0 ...")
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { on = index($0, "## " v " ") == 1; next } on' CHANGELOG.md > release-notes.md
          printf '\nInstall in the browser: https://windkiek.de\n' >> release-notes.md
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/reterminal_e1001/windkiek.bin
          body_path: release-notes.md

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
