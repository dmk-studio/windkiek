    imprint: "Imprint", privacy: "Privacy",
  },
};

const SPOTS = [
  { name: "Mirns", dirs: 0b0001111111110000, min: 14 },
  { name: "Xanten", dirs: 0xffff, min: 14 },
  { name: "Workum", dirs: 0b1111000000011111, min: 15 },
  { name: "Brouwersdam", dirs: 0b1111111000000001, min: 16 },
  { name: "Fehmarn", dirs: 0xffff, min: 13 },
];
const now = Date.now();
const FCS = SPOTS.map((_, i) => demoForecast(i + 3, now));
const view = { page: 0, unit: "kn", lang: "de" };
let siteLang = (localStorage.getItem("lang") || navigator.language || "de").startsWith("de") ? "de" : "en";

const hero = createScreen(document.getElementById("hero"));
function drawHero() {
  const idx = [view.page * 2, view.page * 2 + 1].filter(i => i < SPOTS.length);
  hero.page({ lang: view.lang, unit: view.unit }, idx.map(i => SPOTS[i]), idx.map(i => FCS[i]), view.page, 3, true, 82, now);
}
function drawShots() {
  createScreen(document.getElementById("shotWifi")).setupWifi(null);
  createScreen(document.getElementById("shotSettings")).settingsInfo({ lang: view.lang }, "192.168.178.57", true);
}

function seg(id, key, attr) {
  const el = document.getElementById(id);
  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    view[key] = attr === "page" ? +b.dataset[attr] : b.dataset[attr];
    drawHero();
    if (key === "lang") drawShots();
  });
}
seg("pageSeg", "page", "page");
seg("unitSeg", "unit", "unit");
seg("langSeg", "lang", "dlang");

function applyLang(l) {
  siteLang = l;
  try { localStorage.setItem("lang", l); } catch {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = T[l][el.dataset.t];
    if (v == null) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
  document.querySelectorAll("a.buy").forEach(a => { a.href = BUY_URL; if (AFFILIATE) a.textContent += " *"; });
  document.querySelectorAll(".ad").forEach(el => el.classList.toggle("hidden", !AFFILIATE));
  // Display language follows the site language until chosen explicitly
  if (!document.querySelector("#langSeg button.on")?.dataset.picked) {
    view.lang = l;
    document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.dlang === l));
  }
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { applyLang(b.dataset.lang); drawHero(); drawShots(); }));
document.getElementById("langSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) b.dataset.picked = "1"; });

applyLang(siteLang);
await loadFonts();
drawHero();
drawShots();
</script>
<style>.hidden { display: none !important; }</style>
</body>
</html>
