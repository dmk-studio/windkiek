; Wind forecast for the Seeed reTerminal E1001 (ESP32-S3, 7.5" ePaper)
; https://github.com/dmk-studio/windkiek

[platformio]
default_envs = reterminal_e1001
; Optional machine-specific settings (e.g. core_dir), not under version control
extra_configs = platformio_local.ini

[env:reterminal_e1001]
platform = espressif32 @ ^6.9.0
; The E1001 is an ESP32-S3 with OPI PSRAM, the XIAO ESP32S3 board definition matches it.
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; The USB-C port is wired to UART0 (GPIO43/44) through a CH340,
; so Serial goes to UART0 instead of the native USB CDC.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
; Before the build: embed web/setup.html as src/web_page.h.
; After the build: single image windkiek.bin for the web installer.
extra_scripts =
  pre:tools/embed_web.py
  post:tools/merge_bin.py
lib_deps =
  zinggjm/GxEPD2 @ ^1.6.4
  adafruit/Adafruit GFX Library @ ^1.12.0
  bblanchon/ArduinoJson @ ^7.2.1
